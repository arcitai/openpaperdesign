[package]
name = "openpaperdesign-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The paper-rs editor and canvas renderer in the browser (wasm32 + wgpu)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# Requirements and features match the root package where shared, so the lockfile resolves the
# versions the native app uses.
[dependencies]
egui = "0.36"
wgpu = { version = "30", features = ["webgl"] }
lyon = "1"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
fastrand = "2"
dirs = "6"
i_overlay = "9.0.1"
miniz_oxide = "0.9.1"
usvg = "0.48"
arboard = { package = "openpaperdesign-clipboard-stub", path = "../openpaperdesign-clipboard-stub" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
