<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openpaperdesign</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #eeeef0; }
  body { display: flex; flex-direction: column; }
  /* Fixed-height chrome: status and renderer text never change the canvas size or position. */
  header { flex: 0 0 40px; box-sizing: border-box; height: 40px; display: flex; flex-wrap: nowrap;
           gap: 6px; align-items: center; padding: 0 10px; background: #fff;
           border-bottom: 1px solid #ddd; overflow: hidden; }
  .clip { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { flex: 0 1 auto; font-weight: 600; margin-right: 8px; }
  #status { flex: 1 1 0; margin-left: 8px; text-align: right; color: #555; }
  #status.error { color: #b3261e; font-weight: 600; }
  #stage { flex: 1 1 0; min-height: 0; position: relative; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
            touch-action: none; }
  /* Over the canvas, not in the flow, so showing it doesn't move the canvas. */
  #conflict { display: none; position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px;
              background: #fdecea; color: #8a1c13; border-bottom: 1px solid #f3b8b2; }
  #conflict.show { display: block; }
  footer { flex: 0 0 22px; box-sizing: border-box; height: 22px; line-height: 22px; padding: 0 10px;
           color: #777; font-size: 11px; background: #fff; border-top: 1px solid #ddd; }
  #renderer.error { color: #b3261e; }
</style>
</head>
<body>
<!-- The canvas shows upstream paper-rs's own workspace (layers, inspector, pages, tools,
     palette, menus, help); this bar only names the canvas and shows the save status. -->
<header>
  <span id="title" class="clip">openpaperdesign</span>
  <span id="status" class="clip">Loading…</span>
</header>
<div id="stage">
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="conflict" role="alert"></div>
</div>
<footer id="footer" class="clip">openpaperdesign: a fork of paper-rs (MIT OR Apache-2.0). Inter font:
  SIL OFL 1.1. Not affiliated with Paper. · <span id="renderer">Renderer: starting…</span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
