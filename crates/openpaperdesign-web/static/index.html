<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openpaperdesign</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #eeeef0; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #fff;
           border-bottom: 1px solid #ddd; }
  header button { font: inherit; padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px;
                  background: #fff; cursor: pointer; }
  header button[aria-pressed="true"] { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  header .sep { width: 1px; height: 20px; background: #ddd; margin: 0 4px; }
  #title { font-weight: 600; margin-right: 8px; }
  #status { margin-left: auto; color: #555; }
  #conflict { display: none; padding: 8px 10px; background: #fdecea; color: #8a1c13;
              border-bottom: 1px solid #f3b8b2; }
  #conflict.show { display: block; }
  #canvas { flex: 1; width: 100%; min-height: 0; display: block; outline: none; touch-action: none; }
  footer { padding: 3px 10px; color: #777; font-size: 11px; background: #fff; border-top: 1px solid #ddd; }
</style>
</head>
<body>
<header>
  <span id="title">openpaperdesign</span>
  <button data-tool="select" title="Select (V)">Select</button>
  <button data-tool="hand" title="Hand (H)">Hand</button>
  <button data-tool="rect" title="Rectangle (R)">Rectangle</button>
  <button data-tool="ellipse" title="Ellipse (O)">Ellipse</button>
  <span class="sep"></span>
  <button data-action="undo" title="Undo">Undo</button>
  <button data-action="redo" title="Redo">Redo</button>
  <button data-action="delete" title="Delete selection">Delete</button>
  <span id="status">Loading…</span>
</header>
<div id="conflict" role="alert"></div>
<canvas id="canvas" tabindex="0"></canvas>
<footer id="footer">openpaperdesign: a fork of paper-rs (MIT OR Apache-2.0). Inter font: SIL OFL 1.1.
  Not affiliated with Paper.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
