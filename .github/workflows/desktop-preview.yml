name: Desktop preview packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['packaging/**', 'scripts/package-desktop.py', '.github/workflows/desktop-preview.yml', 'src/**', 'assets/**', 'build.rs', 'LICENSE-*', 'THIRD_PARTY.md', 'Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
          - os: windows-2025
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Build the native app and optional MCP bridge
        run: cargo build --release --locked --bin openpaperdesign --bin paper-rs-mcp
      - name: Verify CLI without opening an owner library
        shell: bash
        run: |
          ./target/release/openpaperdesign --help
          ./target/release/paper-rs-mcp --url
      - name: Package preview and checksums
        run: python scripts/package-desktop.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --bin-dir target/release --output dist
      - name: Keep exact packages for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenPaperDesign-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
