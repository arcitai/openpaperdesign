name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: always

jobs:
  product-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check product assets, cache versions and download selection
        run: |
          python3 scripts/sync-site-assets.py --check
          python3 scripts/refresh-site-versions.py --check
          node --check site/site.js
          node --test scripts/tests/downloads.test.mjs
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Software Vulkan driver (lavapipe) for the GPU tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Build
        run: cargo build --locked --all-targets
      # Serial: the parallel run can SIGSEGV when two MCP screenshot tests initialize Vulkan
      # at once (docs/openpaperdesign/feasibility-2026-10-12.md). The GPU guard makes a
      # missing adapter fail rather than skip.
      - name: Test
        env:
          PAPER_RS_REQUIRE_GPU: "1"
        run: cargo test --locked -- --test-threads=1
      - name: Test openpaperdesign crates (serve API, web input mapping)
        run: cargo test --locked -p openpaperdesign-serve -p openpaperdesign-web
      # The runner's preinstalled Node (>= 22); no setup-node, no package.json. An explicit
      # file, because Node 22 doesn't take a directory here.
      - name: Test the page's editor lifecycle (Node, mocked DOM)
        run: |
          node --version
          node --test crates/openpaperdesign-web/tests/session.test.mjs
      # The plugin: manifests/skills (Node) and the ported design-method tests (Python 3,
      # standard library only).
      - name: Test the openpaperdesign plugin
        run: |
          node --test plugin/tests/plugin.test.mjs
          cd plugin/tests/design && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v

  wasm-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Check portable core and web editor for wasm32
        run: cargo check --locked -p openpaperdesign-core -p openpaperdesign-web --target wasm32-unknown-unknown
